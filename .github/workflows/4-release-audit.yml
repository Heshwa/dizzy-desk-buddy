name: release-audit
on:
  push:
    paths:
      - '.github/workflows/release-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: python scope
        run: |
          echo "HEAD $(git rev-parse HEAD)"
          echo "== python files by top dir"
          git ls-files '*.py' | awk -F/ '{ if ($1=="v2") print $1"/"$2; else print $1 }' | sort | uniq -c
          echo "== python files that import piper directly"
          git grep -lE '^[[:space:]]*(import|from)[[:space:]]+piper' -- '*.py'
          echo "== python files importing the host packages (dizzy or v2.app)"
          git grep -lE '^[[:space:]]*(import|from)[[:space:]]+(dizzy|v2\.app|v2\.app\.[a-z_]+)\b' -- '*.py'
          echo "== files referencing host modules via sys.path or runpy tricks"
          git grep -lE "sys\.path|importlib|runpy|subprocess.*(dizzy|v2.app)" -- '*.py' | head -40
          echo "== python files in cad/ electronics/ hardware/ v2/cad v2/hardware v2/firmware"
          git ls-files '*.py' | grep -E '^(cad|electronics|hardware|v2/cad|v2/hardware|v2/firmware|v2/webots)/'
          echo "== shell and command scripts"
          git ls-files '*.sh' '*.command' '*.cjs' '*.js'
