name: release-audit
on:
  push:
    paths:
      - '.github/workflows/release-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: refs
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' '+refs/pull/*:refs/pull/*' 2>&1 | tail -5 || true
          echo "== all refs (name sha commits-reachable)"
          git for-each-ref --format='%(refname) %(objectname:short)' | while read r s; do echo "$r $s $(git rev-list --count $r 2>/dev/null)"; done
          echo "default: $(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null)"
      - name: per-ref sensitive pattern counts (tree at tip)
        run: |
          for r in $(git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags refs/pull); do
            case $r in */HEAD) continue;; esac
            n_names=$(git grep -IiE 'heshwa|baskaran|zumi' $r -- . ':!.github' 2>/dev/null | wc -l)
            n_paths=$(git grep -IE '/Users/|/home/[a-z]+/|C:\\Users' $r -- . ':!.github' 2>/dev/null | wc -l)
            n_mail=$(git grep -IE '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.(com|org|net|io|in|dev)' $r -- '*.py' '*.md' '*.txt' '*.json' '*.yml' '*.sh' '*.ini' 2>/dev/null | wc -l)
            n_files=$(git ls-tree -r --name-only $r | wc -l)
            echo "$r files=$n_files name_lines=$n_names path_lines=$n_paths mail_lines=$n_mail"
          done
      - name: author email classes across all refs (counts only)
        run: |
          echo "commits by author-email class (all refs)"
          git log --all --format='%ae' | awk '{ if ($0 ~ /users\.noreply\.github\.com$/) c="noreply"; else c="other"; n[c]++ } END{for(k in n) print k, n[k]}'
          echo "distinct non-noreply author emails: $(git log --all --format='%ae' | grep -v 'users.noreply.github.com' | sort -u | wc -l)"
          echo "distinct non-noreply committer emails: $(git log --all --format='%ce' | grep -v 'users.noreply.github.com' | sort -u | wc -l)"
          echo "commit bodies/messages containing email-like or home paths: $(git log --all --format=%B | grep -cE '@[A-Za-z0-9-]+\.[a-z]+|/Users/|/home/[a-z]+/')"
          echo "commits per author name (all refs)"; git log --all --format='%an' | sort | uniq -c
      - name: gitleaks all refs
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact --max-target-megabytes 500 --log-opts="--all" --report-format json --report-path /tmp/gl.json . ; echo "exit $?"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/gl.json'))
          print('findings', len(d))
          for x in d[:30]: print(x['RuleID'], x['File'], x['StartLine'])
          PY
      - name: large or binary blobs reachable from any ref not at current branch tip
        run: |
          git rev-list --objects --all | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' | awk '$1=="blob" && $3>=3000000 {print $3, $4}' | sort -rn | head -20
          echo "total repo size: $(du -sh .git | cut -f1)"
