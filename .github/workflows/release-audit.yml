name: release-audit
on:
  push:
    paths:
      - '.github/workflows/release-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: inventory
        run: |
          echo "tracked files: $(git ls-files | wc -l)"
          echo "== extension counts"
          git ls-files | sed -n 's/.*\.\([A-Za-z0-9]*\)$/\1/p' | sort | uniq -c | sort -rn | head -40
          echo "== top-level dirs"
          git ls-files | cut -d/ -f1 | sort | uniq -c
          echo "== tracked files over 1MB (size path)"
          git ls-files -z | xargs -0 stat -c '%s %n' | awk '$1>1000000' | sort -rn
          echo "== tracked binary files (git eol i/-text)"
          git ls-files --eol | grep 'i/-text' | awk '{print $NF}'
      - name: piper
        run: |
          echo "== tracked files mentioning piper (case-insens)"
          git grep -il piper -- . || true
          echo "== python import lines"
          git grep -nE '^[[:space:]]*(import|from)[[:space:]]+piper' -- '*.py' || true
          echo "== dynamic or subprocess use"
          git grep -nEi "importlib.*piper|piper_tts|PiperVoice|\"piper\"|'piper'" -- . || true
          echo "== requirement files"
          git grep -niE 'piper' -- '*requirements*' '*pyproject*' '*setup.*' || true
      - name: licenses and vendor
        run: |
          echo "== existing license-like files"
          git ls-files | grep -iE '(^|/)(LICENSE|COPYING|NOTICE|THIRD_PARTY|SPDX)' || true
          echo "== SPDX identifiers"
          git grep -hoE 'SPDX-License-Identifier: *[A-Za-z0-9.+-]+' | sort | uniq -c || true
          echo "== vendor-like dirs"
          git ls-files | grep -iE '(vendor|adafruit|third[_-]?party|external|lib/)' | head -80
          echo "== license/copyright lines in vendor-like files"
          for f in $(git ls-files | grep -iE '(vendor|adafruit)' | head -40); do
            echo "-- $f"; git show HEAD:"$f" 2>/dev/null | grep -aiE 'license|copyright|adafruit|mit|bsd|gpl' | head -3 | cut -c1-160
          done
      - name: gitleaks full history incl large files
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact --max-target-megabytes 500 --report-format json --report-path /tmp/gl.json . ; echo "exit $?"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/gl.json'))
          print('findings', len(d))
          for x in d[:30]: print(x['RuleID'], x['File'], x['StartLine'])
          PY
      - name: history large blobs
        run: |
          echo "== blobs >=1MB anywhere in history (size path)"
          git rev-list --objects --all | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' | awk '$1=="blob" && $3>=1000000 {print $3, $4}' | sort -rn | head -40
          echo "commits: $(git rev-list --all --count)"
      - name: binary strings sweep (tracked binaries, secret-like patterns, counts only)
        run: |
          for f in $(git ls-files --eol | grep 'i/-text' | awk '{print $NF}'); do
            n=$(strings -n 8 "$f" | grep -ciE 'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA |EC )?PRIVATE KEY|password=|/Users/|/home/[a-z]+') 
            echo "$n $f"
          done | sort -rn | head -40
          echo "== files with absolute user paths (counts)"
          git grep -ciE '/Users/[A-Za-z]+|C:\\\\Users' -- . | head -40 || true
