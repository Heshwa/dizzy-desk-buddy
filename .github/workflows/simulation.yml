name: simulation
# Host-side simulator runs. None of these touch hardware, real motors or cloud accounts.
# Each job reports separately so a pass in one is never read as coverage for another.
on:
  pull_request:
    paths:
      - 'electronics/**'
      - 'v2/**'
      - 'dizzy/**'
      - '.github/workflows/simulation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  power-ngspice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ngspice
        run: sudo apt-get update -q && sudo apt-get install -y -q ngspice && ngspice -v | head -3
      - name: Run the ngspice supply model
        run: python3 electronics/power/run_power.py
      - name: Margin check on the ngspice results
        run: python3 electronics/power/check_margins.py
      - name: Show measured results (illustrative load model, not a hardware measurement)
        run: |
          ls electronics/power
          cat electronics/power/*.json 2>/dev/null || true
  electronics-host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run chip-model, wiring and firmware-behaviour checks (clang, no Wokwi)
        run: python3 electronics/tests/run_checks.py
  v2-device-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies (no audio or speech packages)
        run: |
          python -m pip install --upgrade pip
          grep -v -i -E '^(piper-tts|sounddevice|onnxruntime)==' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
      - name: Install and start a local MQTT broker (the bridge test sends partner gestures through it)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mosquitto
          sudo systemctl stop mosquitto || true
          printf 'listener 18886 127.0.0.1\nallow_anonymous true\npersistence false\n' > /tmp/mosquitto.conf
          mosquitto -c /tmp/mosquitto.conf -d
          sleep 1; nc -z 127.0.0.1 18886 && echo broker up
      - name: Build shared native face and motion library
        run: v2/tools/build-shared.sh
      - name: Persistence and restart (simulated pet)
        env:
          PYTHONPATH: .
        run: python v2/tools/test-persistence.py
      - name: Device RPC and partner transport (firmware stand-in, not the real firmware)
        env:
          PYTHONPATH: .
        run: python v2/tools/test-bridge.py
  v2-webots-motion:
    # Real Webots physics with the V2 controller and model. Webots R2025a on Linux, headless.
    # The owner's recorded runs used a newer macOS nightly, so a difference here can be a version difference.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Webots R2025a (official release package)
        run: |
          sudo apt-get update -q
          curl -fsSL -o /tmp/webots.deb https://github.com/cyberbotics/webots/releases/download/R2025a/webots_2025a_amd64.deb
          sudo apt-get install -y -q xvfb /tmp/webots.deb python3-numpy
          webots --version || true
      - name: Diagnostic single Webots run (shuffle trial) with controller output
        continue-on-error: true
        env:
          DIZZY_V2_WEBOTS_TEST: shuffle
          DIZZY_V2_WEBOTS_OUT: /tmp/shuffle.json
        run: |
          time timeout 420 xvfb-run -a webots --batch --mode=fast --no-rendering --stdout --stderr v2/webots/worlds/dizzy_v2.wbt 2>&1 | tail -n 60
          ls -la /tmp/shuffle.json && head -c 600 /tmp/shuffle.json
      - name: Run the five Webots motion trials (sweep.py)
        env:
          DIZZY_WEBOTS: webots
          PYTHONPATH: .
        run: |
          xvfb-run -a python3 v2/webots/sweep.py v2/webots/worlds/dizzy_v2.wbt | tee /tmp/webots-sweep.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/webots-sweep.json'))
          for k,v in r.items(): print(k,'PASS' if v['pass'] else 'FAIL','fell=',v['fell'],'forward=',round(v.get('forward',0),3))
          assert all(v['pass'] for v in r.values())
          PY
  v2-freecad-rebuild:
    # Rebuilds the CAD assembly with Linux FreeCAD into the runner only (nothing is committed).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install FreeCAD
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q freecad
          freecadcmd --version || true
      - name: Rebuild the V2 CAD assembly
        working-directory: v2/cad
        run: |
          find /usr -name 'FreeCAD.so' 2>/dev/null | head
          FC=$(dirname "$(find /usr -name 'FreeCAD.so' 2>/dev/null | head -1)")
          echo "FreeCAD lib dir: $FC"
          export PYTHONPATH="$FC"
          python3 build.py 2>&1 | tail -n 40
      - name: Show the rebuilt fit report
        run: ls v2/cad/output | head -30; head -c 1500 v2/cad/output/fit-report.json
