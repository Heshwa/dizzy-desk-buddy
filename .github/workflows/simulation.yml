name: simulation
# Host-side simulator runs. None of these touch hardware, real motors or cloud accounts.
# Each job reports separately so a pass in one is never read as coverage for another.
on:
  pull_request:
    paths:
      - 'electronics/**'
      - 'v2/**'
      - 'dizzy/**'
      - '.github/workflows/simulation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  power-ngspice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ngspice
        run: sudo apt-get update -q && sudo apt-get install -y -q ngspice && ngspice -v | head -3
      - name: Run the ngspice supply model
        run: python3 electronics/power/run_power.py
      - name: Margin check on the ngspice results
        run: python3 electronics/power/check_margins.py
      - name: Show measured results (illustrative load model, not a hardware measurement)
        run: |
          ls electronics/power
          cat electronics/power/*.json 2>/dev/null || true
  electronics-host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run chip-model, wiring and firmware-behaviour checks (clang, no Wokwi)
        run: python3 electronics/tests/run_checks.py
  v2-device-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies (no audio or speech packages)
        run: |
          python -m pip install --upgrade pip
          grep -v -i -E '^(piper-tts|sounddevice|onnxruntime)==' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
      - name: Build shared native face and motion library
        run: v2/tools/build-shared.sh
      - name: Persistence and restart (simulated pet)
        env:
          PYTHONPATH: .
        run: python v2/tools/test-persistence.py
      - name: Device RPC and partner transport (firmware stand-in, not the real firmware)
        env:
          PYTHONPATH: .
        run: python v2/tools/test-bridge.py
