name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  v1-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        # Audio and speech packages are not needed by the unit tests and need system libraries.
        run: |
          python -m pip install --upgrade pip
          grep -v -i -E '^(piper-tts|sounddevice|onnxruntime)==' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
      - name: Run V1 unit tests
        run: python -m pytest -q
