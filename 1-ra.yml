name: release-audit
on:
  push:
    paths:
      - '.github/workflows/release-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: final tree audit
        run: |
          echo "HEAD $(git rev-parse HEAD)"
          echo "== tracked files $(git ls-files | wc -l); largest:"
          git ls-files -z | xargs -0 ls -l | sort -k5 -n -r | head -8 | awk '{print $5, $9}'
          echo "== absolute user paths in tree (count by file)"
          git grep -cE '/Users/[A-Za-z]|/home/[a-z]+/|C:\\Users' -- . ':!LICENSES' | head -20 || true
          echo "== email-like strings in tree (count by file, no values)"
          git grep -cEI '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}' -- . ':!LICENSES' | head -30 || true
          echo "== secret-like patterns (count by file)"
          git grep -cEI '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{30}|BEGIN (RSA |EC )?PRIVATE KEY)' | head || true
          echo "== owner-name lines in tree"
          git grep -ciE 'zumizumistay|heshwa' -- . ':!LICENSE' ':!NOTICE' ':!README.md' ':!THIRD_PARTY.md' | head -20 || true
      - name: historical wasm
        run: |
          for p in body pca9685 ds3231; do
            c=$(git log --all --format=%H -n1 -- v2/hardware/wokwi/$p.chip.wasm)
            c=$(git rev-list -n1 $c^ 2>/dev/null || echo $c)
            git show $c:v2/hardware/wokwi/$p.chip.wasm > /tmp/$p.wasm 2>/dev/null || { echo "$p: not found at $c"; continue; }
            echo "== $p.wasm sha256 $(sha256sum /tmp/$p.wasm | cut -d' ' -f1) size $(stat -c %s /tmp/$p.wasm)"
            strings -n 6 /tmp/$p.wasm | grep -iE 'licen|copyright|wokwi|mit|permission' | head -10
            echo "-- imports/exports"; strings -n 4 /tmp/$p.wasm | grep -E '^(pin_|i2c_|timer_|attr_|buffer_|string_|__wokwi|_symbol|spi_|uart_|framebuffer|debugPrint|mcu_)' | sort -u | head -40
          done
      - name: historical firmware images
        run: |
          for f in dizzy-v2-head.bin dizzy-v2-audio.bin; do
            c=$(git log --all --format=%H -n1 -- v2/firmware/images/$f); c=$(git rev-list -n1 $c^ 2>/dev/null || echo $c)
            git show $c:v2/firmware/images/$f > /tmp/$f 2>/dev/null || { echo "$f not found"; continue; }
            echo "== $f size $(stat -c %s /tmp/$f)"
            for k in freetype FreeType libpng png_ zlib 'inflate' lvgl LVGL jpeg qoi 'newlib' 'Espressif' 'Waveshare' 'tinyusb' 'mbedtls' 'lwip' 'wolfssl' 'BMI270' 'Bosch' 'whisper'; do printf "%s=%s " "$k" "$(strings -n 5 /tmp/$f | grep -c "$k")"; done; echo
          done
