<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280"><rect width="1200" height="1280" fill="#0c1525"/><style>text{font-family:Arial,sans-serif;fill:#e8f1ff}.muted{fill:#a1b2c9}.wire{fill:none;stroke-width:3}</style><text x="45" y="53" font-size="30">DIZZY / electronics connection plan</text><text x="45" y="82" font-size="16">USB-C desk power · original ESP32-WROOM-32E · seated pet with three servo axes</text><rect x="45" y="115" width="300" height="115" rx="14" fill="#17253a" stroke="#40d9ba"/><text x="63" y="144" font-size="18" style="fill:#40d9ba">USB-C input / HUSB238</text><text x="63" y="171" font-size="14">Pi 27 W supply: 5.1 V / 5 A PDO</text><text x="63" y="193" font-size="14">5 V selection only · I²C address 0x08</text><text x="63" y="215" font-size="14">V+ → master switch → 5 V star rail</text><rect x="440" y="115" width="320" height="115" rx="14" fill="#17253a" stroke="#40d9ba"/><text x="458" y="144" font-size="18" style="fill:#40d9ba">Main ESP32 DevKitC V4</text><text x="458" y="171" font-size="14">5V input → onboard 3.3V regulator</text><text x="458" y="193" font-size="14">GPIO logic / pull-ups: 3.3 V only</text><text x="458" y="215" font-size="14">One common ground across all modules</text><rect x="855" y="115" width="300" height="115" rx="14" fill="#17253a" stroke="#40d9ba"/><text x="873" y="144" font-size="18" style="fill:#40d9ba">5 V high-current branches</text><text x="873" y="171" font-size="14">PCA V+ → 3 × SG90 servos</text><text x="873" y="193" font-size="14">MAX98357A + ESP32-CAM</text><text x="873" y="215" font-size="14">Return high currents to the star ground</text><path d="M345 170H440" class="wire" stroke="#ff926d"/><path d="M760 170H855" class="wire" stroke="#ff926d"/><text x="45" y="270" font-size="20">SIGNALS / exact ESP32 GPIO assignments</text><rect x="45" y="295" width="345" height="155" rx="14" fill="#17253a" stroke="#40d9ba"/><text x="63" y="324" font-size="18" style="fill:#40d9ba">Round face · GC9A01 · 240×240</text><text x="63" y="351" font-size="14">3.3V → VCC · GND → GND</text><text x="63" y="373" font-size="14">18 → SCK · 23 → SDA/MOSI</text><text x="63" y="395" font-size="14">19 → CS · 27 → DC · 4 → RST</text><text x="63" y="417" font-size="14">7-pin module: verify its printed pinout</text><rect x="425" y="295" width="350" height="155" rx="14" fill="#17253a" stroke="#40d9ba"/><text x="443" y="324" font-size="18" style="fill:#40d9ba">Shared I²C bus</text><text x="443" y="351" font-size="14">21 → SDA · 22 → SCL</text><text x="443" y="373" font-size="14">DS3231 0x68 · PCA9685 0x40</text><text x="443" y="395" font-size="14">HUSB238 0x08 · common ground</text><text x="443" y="417" font-size="14">One effective 4.7k pull-up pair → 3.3V</text><rect x="810" y="295" width="345" height="155" rx="14" fill="#17253a" stroke="#40d9ba"/><text x="828" y="324" font-size="18" style="fill:#40d9ba">Servo driver · PCA9685</text><text x="828" y="351" font-size="14">VCC → 3.3V · V+ → switched 5V</text><text x="828" y="373" font-size="14">16 → OE · 10k pull-up → 3.3V</text><text x="828" y="395" font-size="14">CH0 neck · CH1 left · CH2 right</text><text x="828" y="417" font-size="14">OE HIGH disables outputs at startup</text><rect x="45" y="480" width="345" height="155" rx="14" fill="#17253a" stroke="#40d9ba"/><text x="63" y="509" font-size="18" style="fill:#40d9ba">Talk + volume buttons</text><text x="63" y="536" font-size="14">GPIO34 → talk · GPIO35 → volume −</text><text x="63" y="558" font-size="14">GPIO39 (VN) → volume +</text><text x="63" y="580" font-size="14">Each GPIO: external 10k → 3.3V</text><text x="63" y="602" font-size="14">Each switch: GPIO → GND when pressed</text><rect x="425" y="480" width="350" height="155" rx="14" fill="#17253a" stroke="#40d9ba"/><text x="443" y="509" font-size="18" style="fill:#40d9ba">Crown touch / camera light</text><text x="443" y="536" font-size="14">13 → left copper crown electrode</text><text x="443" y="558" font-size="14">14 → right copper crown electrode</text><text x="443" y="580" font-size="14">17 → 330Ω → LED anode (+)</text><text x="443" y="602" font-size="14">LED cathode (−) → GND</text><rect x="810" y="480" width="345" height="155" rx="14" fill="#17253a" stroke="#40d9ba"/><text x="828" y="509" font-size="18" style="fill:#40d9ba">Microphone · INMP441</text><text x="828" y="536" font-size="14">VDD → 3.3V · GND / L/R → GND</text><text x="828" y="558" font-size="14">26 → SCK/BCLK · 25 → WS</text><text x="828" y="580" font-size="14">SD → GPIO33</text><text x="828" y="602" font-size="14">Do not power microphone from 5V</text><rect x="45" y="665" width="345" height="155" rx="14" fill="#17253a" stroke="#40d9ba"/><text x="63" y="694" font-size="18" style="fill:#40d9ba">Speaker / MAX98357A</text><text x="63" y="721" font-size="14">VIN → 5V · GND → common GND</text><text x="63" y="743" font-size="14">26 → BCLK · 25 → LRC · 32 → DIN</text><text x="63" y="765" font-size="14">SPK+ / SPK− → 4Ω 3W speaker</text><text x="63" y="787" font-size="14">Neither speaker lead connects to GND</text><rect x="425" y="665" width="350" height="155" rx="14" fill="#17253a" stroke="#40d9ba"/><text x="443" y="694" font-size="18" style="fill:#40d9ba">Camera + clock backup</text><text x="443" y="721" font-size="14">ESP32-CAM 5V → 5V · GND → GND</text><text x="443" y="743" font-size="14">Camera → Mac over Wi-Fi, separate MCU</text><text x="443" y="765" font-size="14">RTC VCC → 3.3V · CR2032 backup</text><text x="443" y="787" font-size="14">Noncharging holder / verify module path</text><rect x="810" y="665" width="345" height="155" rx="14" fill="#17253a" stroke="#40d9ba"/><text x="828" y="694" font-size="18" style="fill:#40d9ba">Local decoupling / mechanics</text><text x="828" y="721" font-size="14">Servo branch: 2 × 470µF / 10V</text><text x="828" y="743" font-size="14">Amplifier: 470µF · MCU: 100µF</text><text x="828" y="765" font-size="14">100nF near each board · polarity checked</text><text x="828" y="787" font-size="14">Neck ±45° · hands 0–118° in demo</text><text x="45" y="867" font-size="20">WHAT EACH SIMULATOR VERIFIES</text><rect x="45" y="890" width="535" height="152" rx="14" fill="#17253a" stroke="#40d9ba"/><text x="63" y="919" font-size="18" style="fill:#40d9ba">Wokwi · firmware + register-level models</text><text x="63" y="946" font-size="14">ESP32 runs compiled Arduino code and reads the switches.</text><text x="63" y="968" font-size="14">Custom GC9A01 / DS3231 / PCA9685 / HUSB238 models.</text><text x="63" y="990" font-size="14">Servo pulses, round pixels, I²C reads and OE power interlock.</text><text x="63" y="1012" font-size="14">Mic, amplifier and camera symbols are wiring-only.</text><rect x="615" y="890" width="540" height="152" rx="14" fill="#17253a" stroke="#40d9ba"/><text x="633" y="919" font-size="18" style="fill:#40d9ba">ngspice · assumed power network</text><text x="633" y="946" font-size="14">4.25 A planned load: 3 servos + MCU + camera + audio.</text><text x="633" y="968" font-size="14">Cable/branch resistance, current limit and capacitor ESR.</text><text x="633" y="990" font-size="14">5 A case: 4.77 V servo rail · 3 A case: 3.15 V.</text><text x="633" y="1012" font-size="14">These are calculated assumptions; measure the real supply.</text><text x="45" y="1084" font-size="20">BENCH CHECKS BEFORE ASSEMBLY</text><text x="45" y="1116" font-size="16">Confirm the actual USB-PD contract and loaded rail voltage before enabling all three motors.</text><text x="45" y="1142" font-size="16">Calibrate each servo’s pulse limits and linkage stops; 500–2500µs is a simulation range only.</text><text x="45" y="1168" font-size="16">Use separate high-current power wiring; never supply motors through the ESP32 regulator.</text><text x="45" y="1194" font-size="16">Verify LCD voltage/pin order, RTC battery charging path, microphone clocks and real touch sensitivity.</text><text x="45" y="1220" font-size="16">Use one power source while programming, or add verified USB backfeed isolation.</text><text x="45" y="1260" font-size="14" style="fill:#a1b2c9">Connection plan, not a PCB fabrication schematic • functional models are not vendor-certified</text></svg>